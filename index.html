<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Календарь занятий</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #222;
    --muted: #666;
    --border: #d0d7de;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;
    --planned: #3b82f6;
    --radius: 10px;
    --gap: 10px;
    --pad: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    padding: var(--pad);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .app { max-width: 1100px; margin: 0 auto; }

  h1 {
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: clamp(18px, 2.4vw, 24px);
    line-height: 1.2;
  }

  .sync-status {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .sync-status.active { color: var(--success); }
  .sync-status.error { color: var(--danger); cursor: pointer; text-decoration: underline; }

  /* ---------- Ученики ---------- */
  .students { display: flex; flex-direction: column; gap: var(--gap); margin-bottom: 16px; }

  .view-toggle { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .view-toggle button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: 0.15s;
  }
  .view-toggle button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .students-grid { display: flex; gap: 8px; flex-wrap: wrap; }

  .student-btn {
    padding: 10px 14px;
    border: 2px solid var(--border);
    background: var(--card);
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: 500;
    position: relative;
    flex: 1 1 160px;
    min-width: 6vw;
    max-width: max-content;
    text-align: left;
    transition: 0.15s;
  }
  .student-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .student-btn.all-students { background: #8b5cf6; color: #fff; border-color: #8b5cf6; flex: 0 0 auto; }
  .student-btn.all-students.active { background: #7c3aed; border-color: #7c3aed; }
  .student-btn .balance { display: block; font-size: 12px; margin-top: 2px; font-weight: 600; }
  .student-btn .price-tag { display: block; font-size: 10px; opacity: 0.7; margin-top: 2px; }
  .student-btn .edit-student {
    position: absolute; top: 3px; right: 3px;
    width: 22px; height: 22px; border: none; border-radius: 50%;
    background: rgba(0,0,0,0.1); color: inherit; cursor: pointer; font-size: 12px;
    opacity: 0; transition: 0.15s; display: flex; align-items: center; justify-content: center;
  }
  .student-btn:hover .edit-student,
  .student-btn:focus-within .edit-student { opacity: 1; }

  .student-dropdown {
    width: 100%;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 16px;
    background: var(--card);
    cursor: pointer;
  }
  .student-dropdown:focus { outline: none; border-color: var(--primary); }

  .add-student {
    padding: 10px 18px;
    border: 2px dashed #aaa;
    background: transparent;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: 500;
    color: #555;
    transition: 0.15s;
  }
  .add-student:hover { border-color: var(--primary); color: var(--primary); }

  /* ---------- Инфо-бар ---------- */
  .info-bar {
    background: var(--card);
    padding: 14px 18px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .balance-big { font-size: clamp(18px, 2.2vw, 22px); font-weight: 600; }
  .balance-big.positive { color: var(--success); }
  .balance-big.negative { color: var(--danger); }
  .balance-big.zero { color: var(--muted); }

  .stats-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-item {
    text-align: center;
    padding: 6px 10px;
    background: var(--bg);
    border-radius: 6px;
    min-width: 72px;
    flex: 1 1 auto;
  }
  .stat-item .label { font-size: 11px; color: var(--muted); }
  .stat-item .value { font-size: 15px; font-weight: 600; }
  .stat-item.paid .value { color: var(--success); }
  .stat-item.unpaid .value { color: var(--danger); }
  .stat-item.planned .value { color: var(--planned); }
  .stat-item.money .value { color: var(--warning); }

  /* ---------- Календарь ---------- */
  .calendar { background: var(--card); border-radius: var(--radius); padding: 16px; }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }
  .cal-header button {
    padding: 8px 12px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  #monthLabel { font-size: clamp(15px, 2vw, 18px); font-weight: 600; text-align: center; flex: 1; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }

  .cal-day-name {
    text-align: center;
    font-weight: 600;
    padding: 6px 2px;
    color: var(--muted);
    font-size: clamp(10px, 1.6vw, 13px);
  }

  .cal-day {
    min-height: 100px;
    min-width: 0;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 5px;
    cursor: pointer;
    background: #fafbfc;
    transition: 0.15s;
    position: relative;
    overflow: hidden;
  }
  .cal-day:hover { background: #eef2ff; }
  .cal-day.other-month { opacity: 0.35; }
  .cal-day.today { border-color: var(--primary); background: #eef2ff; }
  .cal-day .date-num { font-size: clamp(11px, 1.6vw, 13px); font-weight: 600; margin-bottom: 3px; }

  .cal-day .day-actions {
    position: absolute; top: 3px; right: 3px;
    display: flex; gap: 2px;
  }
  .cal-day .day-actions button {
    width: 20px; height: 20px; border: none; border-radius: 4px;
    cursor: pointer; font-size: 12px; opacity: 0;
    transition: 0.15s;
  }
  /* На тач-устройствах кнопки всегда видны */
  @media (hover: none) {
    .cal-day .day-actions button { opacity: 1; }
  }
  .cal-day:hover .day-actions button { opacity: 1; }
  .cal-day .day-actions .btn-add-lesson { background: var(--planned); color: #fff; }
  .cal-day .day-actions .btn-add-payment { background: var(--warning); color: #fff; }

  .lesson {
    font-size: clamp(9px, 1.4vw, 11px);
    padding: 2px 4px;
    border-radius: 4px;
    margin-bottom: 2px;
    color: #fff;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lesson.planned { background: var(--planned); }
  .lesson.done { background: var(--success); }
  .lesson.canceled { background: #9ca3af; text-decoration: line-through; }
  .lesson .student-name { display: block; font-size: 9px; opacity: 0.9; margin-top: 1px; }

  .lesson .paid-mark,
  .lesson .unpaid-mark {
    position: absolute; top: -3px; right: -3px;
    font-size: 9px; border-radius: 50%;
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #fff;
  }
  .lesson .paid-mark { background: #fbbf24; }
  .lesson .unpaid-mark { background: var(--danger); color: #fff; font-weight: 700; }

  .payment-indicator {
    font-size: clamp(9px, 1.4vw, 11px);
    padding: 2px 4px;
    border-radius: 4px;
    margin-bottom: 2px;
    background: #fbbf24;
    color: #78350f;
    cursor: pointer;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legend {
    display: flex; gap: 10px; margin-top: 12px;
    padding: 8px 10px; background: var(--bg);
    border-radius: 6px; flex-wrap: wrap; font-size: 12px;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  /* ---------- Модалки ---------- */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 12px;
    overflow-y: auto;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--card);
    padding: 22px;
    border-radius: 12px;
    width: 500px;
    max-width: 100%;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
  }
  .modal h3 { margin-bottom: 12px; font-size: clamp(16px, 2vw, 19px); }
  .modal label { display: block; margin-top: 10px; font-size: 13px; color: #555; font-weight: 500; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 9px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    margin-top: 4px; font-size: 16px; /* 16px предотвращает зум на iOS */
  }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-ghost { background: #eee; color: #333; }
  .btn:hover { opacity: 0.9; }

  .grades-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px; }
  .grades-grid input { text-align: center; }

  .payment-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .total-display { margin-top: 10px; padding: 10px; background: #fef3c7; border-radius: 6px; text-align: center; }
  .total-display .label { font-size: 12px; color: #78350f; }
  .total-display .value { font-size: 22px; font-weight: 700; color: #92400e; }

  .payments-list { margin-top: 14px; border-top: 1px solid #eee; padding-top: 14px; }
  .payment-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px; background: #fef3c7; border-radius: 6px; margin-bottom: 6px;
    gap: 8px;
  }
  .payment-item .info { flex: 1; min-width: 0; }
  .payment-item .amount { font-weight: 600; color: #92400e; }
  .payment-item .sum { font-size: 12px; color: #78350f; }
  .payment-item .delete {
    background: var(--danger); color: #fff; border: none;
    padding: 5px 9px; border-radius: 4px; cursor: pointer; font-size: 12px;
    flex-shrink: 0;
  }

  /* ---------- Планшеты ---------- */
  @media (max-width: 900px) {
    body { padding: 14px; }
    .cal-day { min-height: 90px; }
    .stat-item { min-width: 60px; }
  }

  /* ---------- Телефоны ---------- */
  @media (max-width: 640px) {
    :root { --pad: 12px; --gap: 8px; }

    h1 { font-size: 17px; }
    .sync-status { font-size: 12px; width: 100%; }

    .student-btn { flex: 1 1 100%; }        /* кнопки учеников — на всю ширину */
    .add-student { flex: 1 1 100%; }

    .info-bar { flex-direction: column; align-items: stretch; }
    .info-bar > div:last-child { text-align: left; }

    .stats-row { justify-content: space-between; }
    .stat-item { flex: 1 1 30%; min-width: 0; padding: 5px 6px; }
    .stat-item .value { font-size: 14px; }

    .calendar { padding: 10px; }

    /* Календарь: на телефоне ячейки уже, шрифт мельче */
    .cal-grid { gap: 3px; }
    .cal-day { min-height: 64px; padding: 3px; border-radius: 4px; }
    .cal-day .date-num { font-size: 11px; margin-bottom: 2px; }
    .cal-day .day-actions { top: 2px; right: 2px; }
    .cal-day .day-actions button { width: 18px; height: 18px; font-size: 11px; opacity: 1; }
    .lesson { font-size: 9px; padding: 1px 3px; }
    .lesson .student-name { font-size: 8px; }
    .lesson .paid-mark, .lesson .unpaid-mark { width: 12px; height: 12px; font-size: 8px; top: -2px; right: -2px; }
    .payment-indicator { font-size: 9px; padding: 1px 3px; }

    .cal-header button { padding: 7px 10px; font-size: 12px; }

    /* Модалки на весь экран */
    .modal-bg { padding: 0; align-items: flex-end; }
    .modal {
      width: 100%;
      max-width: 100%;
      max-height: 92vh;
      border-radius: 14px 14px 0 0;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    }
    .modal-actions { flex-direction: column; }
    .modal-actions .btn { width: 100%; }

    .payment-row { grid-template-columns: 1fr; }
    .grades-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }

    .payment-item { flex-direction: column; align-items: stretch; }
    .payment-item .delete { align-self: flex-end; }
  }

  /* ---------- Очень узкие экраны ---------- */
  @media (max-width: 380px) {
    .cal-day { min-height: 54px; padding: 2px; }
    .cal-day .date-num { font-size: 10px; }
    .lesson { font-size: 8px; }
    .stat-item .label { font-size: 10px; }
    .stat-item .value { font-size: 13px; }
  }

  /* ---------- Тёмная тема (по желанию системы) ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    body { background: var(--bg); color: var(--text); }
    .calendar, .info-bar { background: var(--card); }
    .cal-day { background: #1a2537; border-color: #2b3a52; }
    .cal-day:hover { background: #223049; }
    .cal-day.today { background: #1e2b45; }
    .view-toggle button { background: var(--card); color: var(--text); border-color: var(--border); }
    .student-btn { background: var(--card); color: var(--text); border-color: var(--border); }
    .student-btn.active { background: var(--primary); color: #fff; }
    .modal { background: var(--card); color: var(--text); }
    .modal input, .modal select, .modal textarea { background: #0f172a; color: var(--text); border-color: var(--border); }
    .btn-ghost { background: #334155; color: var(--text); }
    .legend, .stat-item { background: #16233a; }
    .payment-item { background: #3b2f14; }
    .total-display { background: #3b2f14; }
    .add-student { color: var(--muted); border-color: #475569; }
    .add-student:hover { color: var(--primary); border-color: var(--primary); }
  }
    /* ============================================================
     ТЁМНАЯ ТЕМА — ИСПРАВЛЕНИЯ КОНТРАСТА
     Переопределяем inline-стили и проблемные места.
     ============================================================ */
  @media (prefers-color-scheme: dark) {
    /* Заголовки и подписи */
    #currentLabel { color: var(--muted) !important; }
    #currentStudentName { color: var(--text) !important; }
    #lessonInfo { color: var(--muted) !important; }

    /* Модалки: подписи полей */
    .modal label { color: #cbd5e1 !important; }
    .modal h3 { color: var(--text); }
    .modal input::placeholder,
    .modal textarea::placeholder { color: #64748b; }

    /* Select: выпадающий список и option */
    .student-dropdown,
    .modal select {
      background: #0f172a !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }
    .modal select option { background: #0f172a; color: var(--text); }

    /* Поля ввода */
    .modal input,
    .modal textarea {
      background: #0f172a !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    /* Блок отмены занятия (жёлтый) — делаем тёмно-янтарным */
    #cancelBlock label[style*="fef3c7"] {
      background: #3b2f14 !important;
      border-color: #78550f !important;
    }
    #cancelBlock label[style*="fef3c7"] span {
      color: #fbbf24 !important;
    }

    /* Динамический блок расчёта оплаты */
    #paymentBreakdown > div {
      background: #16233a !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
    }
    #paymentBreakdown div[style*="color:#64748b"],
    #paymentBreakdown span[style*="color:#64748b"] { color: #94a3b8 !important; }
    #paymentBreakdown div[style*="color:#0f172a"],
    #paymentBreakdown span[style*="color:#0f172a"] { color: var(--text) !important; }
    #paymentBreakdown div[style*="color:#94a3b8"],
    #paymentBreakdown span[style*="color:#94a3b8"] { color: #94a3b8 !important; }
    #paymentBreakdown div[style*="color:#16a34a"],
    #paymentBreakdown span[style*="color:#16a34a"] { color: #4ade80 !important; }
    #paymentBreakdown div[style*="color:#dc2626"],
    #paymentBreakdown span[style*="color:#dc2626"] { color: #f87171 !important; }
    #paymentBreakdown div[style*="color:#3b82f6"],
    #paymentBreakdown span[style*="color:#3b82f6"] { color: #60a5fa !important; }
    #paymentBreakdown div[style*="border-top"],
    #paymentBreakdown div[style*="border-bottom"] { border-color: var(--border) !important; }

    /* Итоговая плашка «Будет зачислено занятий» */
    .total-display { background: #3b2f14 !important; }
    .total-display .label { color: #fcd34d !important; }
    .total-display .value { color: #fbbf24 !important; }

    /* Список оплат за день */
    .payment-item { background: #3b2f14 !important; }
    .payment-item .amount { color: #fcd34d !important; }
    .payment-item .sum { color: #fbbf24 !important; }

    /* Легенда */
    .legend { color: var(--text); }

    /* Инфо-бар: подпись «Финансовый баланс» */
    #statsContainer div[style*="color:#666"] { color: var(--muted) !important; }
    #statsContainer div[style*="color:#888"] { color: var(--muted) !important; }

    /* Кнопка «Редактировать» в режиме списка */
    .btn-ghost { background: #334155; color: var(--text); }

    /* Скроллбар (по желанию) */
    .modal::-webkit-scrollbar { width: 8px; }
    .modal::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  }
    @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    body { background: var(--bg); color: var(--text); }
    .calendar, .info-bar { background: var(--card); }
    .cal-day { background: #1a2537; border-color: #2b3a52; }
    .cal-day:hover { background: #223049; }
    .cal-day.today { background: #1e2b45; }
    .view-toggle button { background: var(--card); color: var(--text); border-color: var(--border); }
    .student-btn { background: var(--card); color: var(--text); border-color: var(--border); }
    .student-btn.active { background: var(--primary); color: #fff; }
    .modal { background: var(--card); color: var(--text); }
    .modal input, .modal select, .modal textarea { background: #0f172a; color: var(--text); border-color: var(--border); }
    .btn-ghost { background: #334155; color: var(--text); }
    .legend, .stat-item { background: #16233a; }
    .payment-item { background: #3b2f14; }
    .total-display { background: #3b2f14; }
    .add-student { color: var(--muted); border-color: #475569; }
    .add-student:hover { color: var(--primary); border-color: var(--primary); }

    /* === ИСПРАВЛЕНИЕ: кнопки навигации по месяцам === */
    .cal-header button {
      background: #1e293b !important;
      color: var(--text) !important;
      -webkit-text-fill-color: var(--text) !important;
      border-color: var(--border) !important;
    }
    .cal-header button:hover {
      background: #334155 !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <h1>📅 Календарь занятий <span id="syncStatus" class="sync-status">💾 Локально</span></h1>
  <div class="students" id="studentsList"></div>
  <div class="info-bar">
    <div>
      <div style="color:#666; font-size:13px;" id="currentLabel">Текущий ученик</div>
      <div id="currentStudentName" style="font-size:18px; font-weight:600;">—</div>
    </div>
    <div id="statsContainer"></div>
  </div>
  <div class="calendar">
    <div class="cal-header">
      <button onclick="changeMonth(-1)">← Назад</button>
      <div id="monthLabel"></div>
      <button onclick="changeMonth(1)">Вперёд →</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend" id="legend"></div>

async function loadData() {
  // 1) Сначала локальные данные (мгновенный старт)
  const localData = localStorage.getItem('tutorApp');

    try { data = JSON.parse(localData); }

  }

  // 2) Инициализация Firebase + анонимный вход
  await initFirebase();

  if (isFirebaseActive && db && window._fb) {
    try {
      const { ref, get } = window._fb;
      const snapshot = await get(ref(db, DATA_PATH));
      if (snapshot.exists()) {
        data = snapshot.val();
        localStorage.setItem('tutorApp', JSON.stringify(data));
        document.getElementById('syncStatus').innerHTML = '☁️ Синхронизировано';
        document.getElementById('syncStatus').classList.add('active');

        // В Firebase ещё нет данных — записываем текущие (локальные/демо)
        await save();
      }

      console.warn("Не удалось прочитать из Firebase, работаем локально", e);

function setupRealtime() {
  if (!isFirebaseActive || !db || !window._fb) return;
  const { ref, onValue } = window._fb;
  const dataRef = ref(db, DATA_PATH);
  unsubscribeFirebase = onValue(dataRef, (snapshot) => {
    if (snapshot.exists()) {
      const incoming = snapshot.val();
      // Не перерисовываем, если данные идентичны (грубая проверка)
      if (JSON.stringify(incoming) !== JSON.stringify(data)) {
        data = incoming;
        applyMigrations();
        render();
      }
    }
  });
}

function applyMigrations() {
  if (!data.students) data.students = [];
  if (!data.lessons) data.lessons = [];
  if (!data.payments) data.payments = [];
  if (!data.viewMode) data.viewMode = 'buttons';
  data.students.forEach(s => {
    if (s.pricePerLesson === undefined || s.pricePerLesson <= 0) s.pricePerLesson = DEFAULT_PRICE;
    if (!s.className) s.className = '';
    if (!s.grades) s.grades = { lastYear: '', currentYear: '', q1: '', q2: '', q3: '', q4: '' };
    if (!s.goalNote) s.goalNote = '';
  });
  // Firebase может превратить массивы в объекты с числовыми ключами — нормализуем
  ['students', 'lessons', 'payments'].forEach(key => {
    if (data[key] && !Array.isArray(data[key])) {
      data[key] = Object.keys(data[key]).map(k => data[key][k]);
    }
  });
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const year = currentDate.getFullYear(), month = currentDate.getMonth();
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('monthLabel').textContent = `${monthNames[month]} ${year}`;
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => {
    const el = document.createElement('div'); el.className = 'cal-day-name'; el.textContent = d; grid.appendChild(el);
  });
  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay() - 1;
  if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const today = new Date();
  for (let i = startOffset; i > 0; i--) grid.appendChild(makeDayCell(prevDays - i + 1, true, new Date(year, month - 1, prevDays - i + 1)));
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    grid.appendChild(makeDayCell(d, false, date, date.toDateString() === today.toDateString()));
  }
  const totalCells = startOffset + daysInMonth;
  const tail = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= tail; i++) grid.appendChild(makeDayCell(i, true, new Date(year, month + 1, i)));
  renderLegend();
}

function makeDayCell(dayNum, otherMonth, date, isToday = false) {
  const cell = document.createElement('div');
  cell.className = 'cal-day' + (otherMonth ? ' other-month' : '') + (isToday ? ' today' : '');
  const dateStr = date.toISOString().slice(0, 10);
  cell.innerHTML = `<div class="date-num">${dayNum}</div>`;
  if (!otherMonth) {
    if (currentStudentId !== 'all') {
      const actions = document.createElement('div'); actions.className = 'day-actions';
      const btnLesson = document.createElement('button'); btnLesson.className = 'btn-add-lesson'; btnLesson.textContent = '+';
      btnLesson.onclick = (e) => { e.stopPropagation(); selectedDate = date; openModal('modalNew'); };
      actions.appendChild(btnLesson);
      const btnPayment = document.createElement('button'); btnPayment.className = 'btn-add-payment'; btnPayment.textContent = '💰';
      btnPayment.onclick = (e) => { e.stopPropagation(); openPaymentModal(date); };
      actions.appendChild(btnPayment);
      cell.appendChild(actions);
    }
    let dayLessons = currentStudentId === 'all'
      ? data.lessons.filter(l => new Date(l.date).toISOString().slice(0, 10) === dateStr)
      : data.lessons.filter(l => l.studentId === currentStudentId && new Date(l.date).toISOString().slice(0, 10) === dateStr);
    dayLessons.sort((a, b) => a.time.localeCompare(b.time));
    dayLessons.forEach(l => {
      const el = document.createElement('div'); el.className = 'lesson ' + l.status;
      const student = data.students.find(s => s.id === l.studentId);
      let content = `${l.time}`;
      if (currentStudentId === 'all') content += `<span class="student-name">${student ? student.name : 'Неизвестный'}</span>`;
      el.innerHTML = content;
      if (l.status === 'done' || l.status === 'planned') {
        const paid = isLessonPaid(l);
        if (paid === true) {
          const mark = document.createElement('span'); mark.className = 'paid-mark'; mark.textContent = '💰';
          mark.title = l.status === 'done' ? 'Оплачено' : 'Есть предоплата';
          if (l.status === 'planned') mark.style.background = '#60a5fa';
          el.appendChild(mark);
        } else if (paid === false) {
          const mark = document.createElement('span'); mark.className = 'unpaid-mark'; mark.textContent = '!';
          mark.title = l.status === 'done' ? 'Не оплачено (долг)' : 'Нет предоплаты';
          el.appendChild(mark);
        }
      } else if (l.status === 'canceled' && l.chargeForCancel) {
        const mark = document.createElement('span'); mark.className = 'paid-mark'; mark.textContent = '💰'; mark.title = 'Оплата удержана'; mark.style.background = '#f59e0b';
        el.appendChild(mark);
      }
      el.onclick = (e) => { e.stopPropagation(); openLessonModal(l.id); };
      cell.appendChild(el);
    });
    if (currentStudentId !== 'all') {
      data.payments.filter(p => p.studentId === currentStudentId && p.date === dateStr).forEach(p => {
        const el = document.createElement('div'); el.className = 'payment-indicator';
        el.textContent = `💰 ${(p.sum !== undefined ? p.sum : (p.amount * (p.pricePerLesson || DEFAULT_PRICE)))} ₽`;
        el.onclick = (e) => { e.stopPropagation(); openPaymentModal(date); };
        cell.appendChild(el);
      });
    }
  }
  return cell;
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function openNewStudentModal() {
  document.getElementById('studentModalTitle').textContent = 'Новый ученик';
  document.getElementById('editStudentId').value = '';
  ['sdName','sdClass','sdGradeLast','sdGradeCurrent','sdGradeQ1','sdGradeQ2','sdGradeQ3','sdGradeQ4','sdGoal'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('sdPrice').value = DEFAULT_PRICE;
  document.getElementById('btnDeleteStudent').style.display = 'none';
  openModal('modalStudentDetails');
}

function openEditStudentModal(studentId) {
  const s = data.students.find(x => x.id === studentId);
  if (!s) return;
  document.getElementById('studentModalTitle').textContent = 'Редактировать ученика';
  document.getElementById('editStudentId').value = s.id;
  document.getElementById('sdName').value = s.name;
  document.getElementById('sdClass').value = s.className || '';
  document.getElementById('sdPrice').value = s.pricePerLesson;
  document.getElementById('sdGradeLast').value = s.grades?.lastYear || '';
  document.getElementById('sdGradeCurrent').value = s.grades?.currentYear || '';
  document.getElementById('sdGradeQ1').value = s.grades?.q1 || '';
  document.getElementById('sdGradeQ2').value = s.grades?.q2 || '';
  document.getElementById('sdGradeQ3').value = s.grades?.q3 || '';
  document.getElementById('sdGradeQ4').value = s.grades?.q4 || '';
  document.getElementById('sdGoal').value = s.goalNote || '';
  document.getElementById('btnDeleteStudent').style.display = 'block';
  openModal('modalStudentDetails');
}

function saveStudentDetails() {
  const id = document.getElementById('editStudentId').value;
  const name = document.getElementById('sdName').value.trim();
  if (!name) return alert('Введите имя ученика');
  const studentData = {
    name, className: document.getElementById('sdClass').value.trim(),
    pricePerLesson: parseInt(document.getElementById('sdPrice').value) || DEFAULT_PRICE,
    grades: { lastYear: document.getElementById('sdGradeLast').value.trim(), currentYear: document.getElementById('sdGradeCurrent').value.trim(), q1: document.getElementById('sdGradeQ1').value.trim(), q2: document.getElementById('sdGradeQ2').value.trim(), q3: document.getElementById('sdGradeQ3').value.trim(), q4: document.getElementById('sdGradeQ4').value.trim() },
    goalNote: document.getElementById('sdGoal').value.trim()
  };
  if (id) {
    const idx = data.students.findIndex(x => x.id === id);
    if (idx !== -1) data.students[idx] = { ...data.students[idx], ...studentData };
  } else {
    studentData.id = Date.now().toString();
    data.students.push(studentData);
    currentStudentId = studentData.id;
  }
  save(); closeModal('modalStudentDetails'); render();
}

function deleteStudent() {
  const id = document.getElementById('editStudentId').value;
  if (confirm('Удалить ученика и ВСЕ его данные?')) {
    data.students = data.students.filter(x => x.id !== id);
    data.lessons = data.lessons.filter(x => x.studentId !== id);
    data.payments = data.payments.filter(x => x.studentId !== id);
    if (currentStudentId === id) currentStudentId = 'all';
    save(); closeModal('modalStudentDetails'); render();
  }
}

function saveNewLesson() {
  data.lessons.push({ id: Date.now().toString(), studentId: document.getElementById('newStudentSelect').value, date: selectedDate.toISOString(), time: document.getElementById('newTime').value, status: 'planned', cancelReason: null, chargeForCancel: false });
  save(); closeModal('modalNew'); render();
}

function updatePaymentBreakdown() {
  const studentId = document.getElementById('payStudentSelect').value;
  const sum = parseFloat(document.getElementById('paySum').value) || 0;
  const price = parseFloat(document.getElementById('payPrice').value) || 35;
  const student = data.students.find(s => s.id === studentId);
  if (!student || price <= 0) return;
  const currentFin = getFinancials(studentId);
  const currentBalText = currentFin.balanceMoney >= 0 ? `+${currentFin.balanceMoney} ₽` : `${currentFin.balanceMoney} ₽`;
  const balColor = currentFin.balanceMoney >= 0 ? '#16a34a' : '#dc2626';
  const paidIds = getPaidLessonIds(studentId);
  const unpaidDone = data.lessons.filter(l => l.studentId === studentId && l.status === 'done' && !paidIds.has(l.id)).sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime() || a.time.localeCompare(b.time));
  const unpaidPlanned = data.lessons.filter(l => l.studentId === studentId && l.status === 'planned' && !paidIds.has(l.id)).sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime() || a.time.localeCompare(b.time));
  let remaining = sum;
  const coveredPast = [], coveredFuture = [];
  for (const l of unpaidDone) { if (remaining >= price) { remaining -= price; coveredPast.push(l); } else break; }
  for (const l of unpaidPlanned) { if (remaining >= price) { remaining -= price; coveredFuture.push(l); } else break; }
  const newBalance = currentFin.balanceMoney + sum;
  let html = `<div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0; font-size:13px; line-height:1.5;">
    <div style="margin-bottom:10px; font-size:12px; color:#64748b; display:flex; justify-content:space-between; border-bottom:1px solid #e2e8f0; padding-bottom:8px;"><span>Баланс до оплаты:</span> <span style="color:${balColor}; font-weight:700;">${currentBalText}</span></div>
    <div style="margin-bottom:12px; font-weight:700; color:#0f172a; font-size:16px; display:flex; justify-content:space-between;"><span>💵 Внесено:</span> <span>${sum} ₽</span></div>`;
  if (sum > 0) {
    if (coveredPast.length > 0) html += `<div style="color:#dc2626; margin-bottom:6px; display:flex; justify-content:space-between;"><span>🔴 Погашение долга (${coveredPast.map(l => new Date(l.date).toLocaleDateString('ru-RU')).join(', ')}):</span><span style="font-weight:600;">${coveredPast.length} зан. (${coveredPast.length * price} ₽)</span></div>`;
    else if (unpaidDone.length > 0) html += `<div style="color:#94a3b8; margin-bottom:6px; display:flex; justify-content:space-between;"><span>⚪ Прошлые неоплаченные:</span> <span>${unpaidDone.length} зан. (не хватило)</span></div>`;
    if (coveredFuture.length > 0) html += `<div style="color:#3b82f6; margin-bottom:6px; display:flex; justify-content:space-between;"><span>🔵 Аванс (${coveredFuture.map(l => new Date(l.date).toLocaleDateString('ru-RU')).join(', ')}):</span><span style="font-weight:600;">${coveredFuture.length} зан. (${coveredFuture.length * price} ₽)</span></div>`;
    else if (unpaidPlanned.length > 0) html += `<div style="color:#94a3b8; margin-bottom:6px; display:flex; justify-content:space-between;"><span>⚪ Запланированные:</span> <span>${unpaidPlanned.length} зан. (не хватило)</span></div>`;
    if (remaining > 0) html += `<div style="color:#16a34a; font-weight:600; margin-top:8px; padding-top:8px; border-top:1px dashed #cbd5e1; display:flex; justify-content:space-between;"><span>🟢 Остаток на депозите:</span> <span>${remaining} ₽</span></div>`;
    else if (coveredPast.length + coveredFuture.length > 0) html += `<div style="color:#16a34a; margin-top:8px; padding-top:8px; border-top:1px dashed #cbd5e1; font-size:12px;">🟢 Сумма распределена полностью</div>`;
  } else {
    html += `<div style="color:#94a3b8; margin-top:8px; font-size:12px;">Введите сумму для расчета</div>`;
  }
  html += `<div style="margin-top:12px; padding-top:10px; border-top:2px solid #e2e8f0; font-weight:700; color:#0f172a; font-size:15px; display:flex; justify-content:space-between;"><span>Новый баланс:</span> <span style="color:${newBalance >= 0 ? '#16a34a' : '#dc2626'}">${newBalance >= 0 ? '+' : ''}${newBalance} ₽</span></div></div>`;
  document.getElementById('paymentBreakdown').innerHTML = html;
  document.getElementById('payTotalLessons').textContent = `${coveredPast.length + coveredFuture.length}`;
}

function openPaymentModal(date) {
  selectedDate = date;
  document.getElementById('payDate').value = date.toISOString().slice(0, 10);
  document.getElementById('paySum').value = '';
  document.getElementById('payComment').value = '';
  const select = document.getElementById('payStudentSelect');
  select.innerHTML = '';
  data.students.forEach(s => {
    const opt = document.createElement('option'); opt.value = s.id; opt.textContent = `${s.name} (${s.pricePerLesson} ₽/зан)`;
    if (s.id === currentStudentId) opt.selected = true;
    select.appendChild(opt);
  });
  const sel = data.students.find(s => s.id === select.value);
  document.getElementById('payPrice').value = sel ? sel.pricePerLesson : DEFAULT_PRICE;
  updatePaymentBreakdown();
  const list = document.getElementById('paymentsList'); list.innerHTML = '';
  const dayPayments = data.payments.filter(p => p.studentId === (currentStudentId === 'all' ? select.value : currentStudentId) && p.date === document.getElementById('payDate').value);
  if (dayPayments.length > 0) {
    list.appendChild(Object.assign(document.createElement('div'), { style: 'font-weight:600; margin-bottom:10px;', textContent: 'Оплаты за этот день:' }));
    dayPayments.forEach(p => {
      const sum = p.sum !== undefined ? p.sum : (p.amount * (p.pricePerLesson || DEFAULT_PRICE));
      const lessons = p.amount !== undefined ? p.amount : Math.floor(sum / (p.pricePerLesson || DEFAULT_PRICE));
      const student = data.students.find(s => s.id === p.studentId);
      const item = document.createElement('div'); item.className = 'payment-item';
      item.innerHTML = `<div class="info"><div class="amount">${sum} ₽ <span style="font-size:11px; color:#78350f; font-weight:400;">(${lessons} зан.)</span></div><div class="sum">${student ? student.name : ''} ${p.comment ? '· ' + p.comment : ''}</div></div><button class="delete" onclick="deletePayment('${p.id}')">Удалить</button>`;
      list.appendChild(item);
    });
  }
  openModal('modalPayment');
}

document.getElementById('paySum').addEventListener('input', updatePaymentBreakdown);
document.getElementById('payPrice').addEventListener('input', updatePaymentBreakdown);
document.getElementById('payStudentSelect').addEventListener('change', (e) => {
  const s = data.students.find(x => x.id === e.target.value);
  document.getElementById('payPrice').value = s ? s.pricePerLesson : DEFAULT_PRICE;
  updatePaymentBreakdown();
});

function savePayment() {
  const sum = parseFloat(document.getElementById('paySum').value) || 0;
  const price = parseFloat(document.getElementById('payPrice').value) || 0;
  if (sum <= 0) return alert('Укажите сумму');
  if (price <= 0) return alert('Укажите стоимость');
  data.payments.push({ id: Date.now().toString(), studentId: document.getElementById('payStudentSelect').value, sum, amount: Math.floor(sum / price), pricePerLesson: price, date: document.getElementById('payDate').value, comment: document.getElementById('payComment').value.trim() });
  save(); closeModal('modalPayment'); render();
}

function deletePayment(id) {
  if (confirm('Удалить оплату?')) {
    data.payments = data.payments.filter(p => p.id !== id);
    save(); openPaymentModal(selectedDate); render();
  }
}

function openLessonModal(lessonId) {
  selectedLessonId = lessonId;
  const l = data.lessons.find(x => x.id === lessonId);
  const student = data.students.find(s => s.id === l.studentId);
  const statusText = { planned: 'Запланировано', done: 'Проведено', canceled: 'Отменено' }[l.status];
  let infoHtml = `<b>${student ? student.name : 'Неизвестный'}</b><br>${new Date(l.date).toLocaleDateString('ru-RU')} — <b>${statusText}</b>`;
  if (l.cancelReason) infoHtml += `<br>Причина: <i>${l.cancelReason}</i>`;
  if (l.status === 'done' || l.status === 'planned') {
    const paid = isLessonPaid(l);
    if (paid === true) infoHtml += `<br><span style="color:#16a34a; font-weight:600;">✅ Оплачено</span>`;
    else if (paid === false) infoHtml += `<br><span style="color:#dc2626; font-weight:600;">⚠️ Не оплачено</span>`;
  } else if (l.status === 'canceled') {
    infoHtml += l.chargeForCancel ? `<br><span style="color:#f59e0b; font-weight:600;">💰 Оплата удержана</span>` : `<br><span style="color:#16a34a; font-weight:600;">✅ Оплата не списана</span>`;
  }
  document.getElementById('lessonTitle').textContent = `Занятие ${l.time}`;
  document.getElementById('lessonInfo').innerHTML = infoHtml;
  document.getElementById('cancelBlock').style.display = 'none';
  const actions = document.getElementById('lessonActions'); actions.innerHTML = '';
  const addBtn = (text, cls, onclick) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = text; b.onclick = onclick; actions.appendChild(b); };
  if (l.status === 'planned') { addBtn('✅ Проведено', 'btn-success', () => setStatus('done')); addBtn('❌ Отменить', 'btn-danger', () => showCancel()); }
  else if (l.status === 'done') { addBtn('↩ В план', 'btn-ghost', () => setStatus('planned')); addBtn('❌ Отменить', 'btn-danger', () => showCancel()); }
  else if (l.status === 'canceled') { addBtn('↩ В план', 'btn-ghost', () => setStatus('planned')); }
  addBtn('🗑 Удалить', 'btn-ghost', () => { if (confirm('Удалить занятие?')) { data.lessons = data.lessons.filter(x => x.id !== lessonId); save(); closeModal('modalLesson'); render(); } });
  addBtn('Закрыть', 'btn-ghost', () => closeModal('modalLesson'));
  openModal('modalLesson');
}

function setStatus(status) {
  const l = data.lessons.find(x => x.id === selectedLessonId);
  l.status = status;
  if (status !== 'canceled') { l.cancelReason = null; l.chargeForCancel = false; }
  save(); closeModal('modalLesson'); render();
}

function showCancel() {
  document.getElementById('cancelBlock').style.display = 'block';
  document.getElementById('cancelCharge').checked = false;
  const actions = document.getElementById('lessonActions'); actions.innerHTML = '';
  const addBtn = (text, cls, onclick) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = text; b.onclick = onclick; actions.appendChild(b); };
  addBtn('💾 Сохранить отмену', 'btn-danger', () => {
    const reason = document.getElementById('cancelReason').value;
    const charge = document.getElementById('cancelCharge').checked;
    const l = data.lessons.find(x => x.id === selectedLessonId);
    l.status = 'canceled';
    l.cancelReason = reason === 'other' ? (document.getElementById('cancelReasonText').value || 'Не указана') : reason;
    l.chargeForCancel = charge;
    save(); closeModal('modalLesson'); render();
  });
  addBtn('Назад', 'btn-ghost', () => openLessonModal(selectedLessonId));
}

document.getElementById('cancelReason').onchange = (e) => { document.getElementById('cancelReasonText').style.display = e.target.value === 'other' ? 'block' : 'none'; };

function changeMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); render(); }

function render() {
  rebuildPaidCache();
  renderStudents();
  const statsContainer = document.getElementById('statsContainer');
  const year = currentDate.getFullYear(), month = currentDate.getMonth();

  // Общий подсчёт платежей за текущий отображаемый месяц (для обоих режимов)
  const monthNames = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const monthName = monthNames[month];

  if (currentStudentId === 'all') {
    document.getElementById('currentLabel').textContent = 'Режим просмотра';
    document.getElementById('currentStudentName').textContent = 'Все ученики';

    const monthLessons = data.lessons.filter(l => { const d = new Date(l.date); return d.getFullYear() === year && d.getMonth() === month; });
    const planned = monthLessons.filter(l => l.status === 'planned').length;
    const done = monthLessons.filter(l => l.status === 'done').length;
    const canceled = monthLessons.filter(l => l.status === 'canceled').length;
    const paid = monthLessons.filter(l => (l.status === 'done' || l.status === 'planned' || (l.status === 'canceled' && l.chargeForCancel)) && isLessonPaid(l)).length;

    let monthEarned = 0;
    data.payments.forEach(p => {
      const d = new Date(p.date);
      if (d.getFullYear() === year && d.getMonth() === month) {
        monthEarned += (p.sum !== undefined ? p.sum : (p.amount * (p.pricePerLesson || DEFAULT_PRICE)));
      }
    });

    statsContainer.innerHTML = `
      <div class="stats-row">
        <div class="stat-item planned"><div class="label">Запланировано</div><div class="value">${planned}</div></div>
        <div class="stat-item paid"><div class="label">Оплачено</div><div class="value">${paid}</div></div>
        <div class="stat-item unpaid"><div class="label">Не оплачено</div><div class="value">${done - paid}</div></div>
        <div class="stat-item"><div class="label">Отменено</div><div class="value">${canceled}</div></div>
        <div class="stat-item money"><div class="label">Получено за ${monthName}</div><div class="value">${monthEarned} ₽</div></div>
      </div>`;
  } else {
    document.getElementById('currentLabel').textContent = 'Текущий ученик';
    const s = data.students.find(x => x.id === currentStudentId);
    document.getElementById('currentStudentName').textContent = s ? s.name : '—';

    const fin = s ? getFinancials(s.id) : { balanceMoney: 0, totalPaid: 0 };
    const bal = fin.balanceMoney;

    // Платежи конкретного ученика за отображаемый месяц
    let studentMonthEarned = 0;
    let studentMonthPaymentsCount = 0;
    data.payments.forEach(p => {
      if (p.studentId !== currentStudentId) return;
      const d = new Date(p.date);
      if (d.getFullYear() === year && d.getMonth() === month) {
        studentMonthEarned += (p.sum !== undefined ? p.sum : (p.amount * (p.pricePerLesson || DEFAULT_PRICE)));
        studentMonthPaymentsCount++;
      }
    });

    // Занятия ученика за отображаемый месяц
    const studentMonthLessons = data.lessons.filter(l => {
      if (l.studentId !== currentStudentId) return false;
      const d = new Date(l.date);
      return d.getFullYear() === year && d.getMonth() === month;
    });
    const studentMonthDone = studentMonthLessons.filter(l => l.status === 'done').length;
    const studentMonthPlanned = studentMonthLessons.filter(l => l.status === 'planned').length;

    statsContainer.innerHTML = `
      <div style="text-align:right;">
        <div style="color:#666; font-size:13px;">Финансовый баланс</div>
        <div class="balance-big ${bal > 0 ? 'positive' : bal < 0 ? 'negative' : 'zero'}">${(bal >= 0 ? '+' : '') + bal} ₽</div>
        <div style="font-size:12px; color:#888; margin-top:2px;">${bal >= 0 ? 'Депозит / Предоплата' : 'Задолженность'}</div>
      </div>
      <div class="stats-row" style="margin-top:10px; width:100%;">
        <div class="stat-item money"><div class="label">Внесено за ${monthName}</div><div class="value">${studentMonthEarned} ₽</div></div>
        <div class="stat-item"><div class="label">Платежей за ${monthName}</div><div class="value">${studentMonthPaymentsCount}</div></div>
        <div class="stat-item paid"><div class="label">Проведено за ${monthName}</div><div class="value">${studentMonthDone}</div></div>
        <div class="stat-item planned"><div class="label">Запланировано за ${monthName}</div><div class="value">${studentMonthPlanned}</div></div>
      </div>`;
  }
  renderCalendar();
}
function populateStudentSelect() {
  const select = document.getElementById('newStudentSelect');
  select.innerHTML = '';
  data.students.forEach(s => {
    const opt = document.createElement('option'); opt.value = s.id; opt.textContent = s.name;
    if (s.id === currentStudentId && currentStudentId !== 'all') opt.selected = true;
    select.appendChild(opt);
  });
}

const originalOpenModal = openModal;
openModal = function(id) { if (id === 'modalNew') populateStudentSelect(); originalOpenModal(id); };

loadData().then(() => {
  if (data.students.length === 0) {
    data.students.push({ id: 'demo1', name: 'Демо-ученик', className: '9', pricePerLesson: DEFAULT_PRICE, grades: { lastYear: '4', currentYear: '', q1: '5', q2: '', q3: '', q4: '' }, goalNote: 'Подготовка к экзамену' });
    save();
  }
});
